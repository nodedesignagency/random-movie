name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & screenshot
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS-26" in k), reverse=True)
          for preferred in ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16"):
              for runtime in runtimes:
                  for device in devices[runtime]:
                      if device["name"] == preferred:
                          print(device["udid"]); sys.exit()
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set +e
          xcodebuild -project Reel.xcodeproj -scheme Reel -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          echo "---- diagnostics ----"
          grep -E "(error|warning): " build.log | sort -u | head -200
          echo "---- tail ----"
          tail -n 15 build.log
          exit $status

      - name: Screenshots and spin recording
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Reel.app
          BUNDLE=com.nodedesign.reel
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots

          shoot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }

          shoot 01-reel 5 -ReelSeedStubs YES
          shoot 02-filters 4 -ReelShowFilters YES
          shoot 03-orbit 4 -ReelStartTab orbit -ReelOrbitPath blade-runner-2049,drive
          shoot 04-stubs 4 -ReelStartTab stubs
          shoot 05-detail 4 -ReelOpenDetail dune

          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force shots/spin.mp4 &
          RECORDER=$!
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -ReelAutoSpin YES
          sleep 2.6
          xcrun simctl io "$UDID" screenshot shots/06-spinning.png
          sleep 4
          kill -INT $RECORDER
          wait $RECORDER || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
